<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five9 Schedule - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-card {
      width: 100%; max-width: 400px; background: var(--surface); border-radius: var(--radius-lg);
      padding: 40px 36px; box-shadow: var(--shadow);
    }
    .login-card h1 { text-align: center; margin: 0 0 6px; font-size: 22px; color: var(--text); }
    .login-card .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .login-field input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-size: 14px; background: #fff; color: var(--text); outline: none; transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--primary); }
    .login-btn {
      width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
      border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; margin-top: 8px;
    }
    .login-btn:hover { background: var(--primary-dark); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error {
      display: none; background: rgba(217,45,32,0.08); color: #a7271e; padding: 10px 14px;
      border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
    }
    .login-error.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Five9 Schedule</h1>
    <p class="subtitle">Inicia sesión para continuar</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="login-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Iniciar sesión</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Conectando...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await resp.json();

        if (!data.success) {
          throw new Error(data.error || 'Error de autenticación');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
